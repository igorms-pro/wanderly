<!doctype html>
<html lang="en" suppressHydrationWarning>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voyagely – AI-Powered Travel Planning for Groups</title>
  <meta name="description" content="Plan your perfect trip with AI-powered itineraries. Collaborate with friends, vote on activities, and plan together in real time." />
  <meta name="theme-color" content="#f97316" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Voyagely" />
  <link rel="apple-touch-icon" href="/pwa-192.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" />
  <script>
    // Prevent flash of unstyled content (FOUC) for dark mode
    (function() {
      const theme = localStorage.getItem('voyagely-theme');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      if (theme === 'dark' || (!theme && systemPrefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
    
    // Set language attribute on html element for i18n
    (function() {
      const savedLanguage = localStorage.getItem('i18nextLng');
      const supportedLanguages = ['en', 'fr', 'es', 'pt', 'pt-BR', 'ja', 'zh', 'de', 'it', 'ru'];
      const browserLanguage = navigator.language;
      
      let language = savedLanguage || browserLanguage;
      
      // Validate language is supported
      if (!supportedLanguages.includes(language)) {
        // Try to match base language (e.g., 'pt-BR' -> 'pt', 'en-US' -> 'en')
        const baseLanguage = language.split('-')[0];
        if (supportedLanguages.includes(baseLanguage)) {
          language = baseLanguage;
        } else if (language.includes('-')) {
          // Try full match first (e.g., 'pt-BR')
          const fullMatch = supportedLanguages.find(lang => language.startsWith(lang));
          if (fullMatch) {
            language = fullMatch;
          } else {
            language = 'en'; // Fallback to English
          }
        } else {
          language = 'en'; // Fallback to English
        }
      }
      
      document.documentElement.setAttribute('lang', language);
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
